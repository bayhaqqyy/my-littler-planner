name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
      EXPO_PUBLIC_SNOOZE_URL: ${{ secrets.EXPO_PUBLIC_SNOOZE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run build:web

      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request' && env.VERCEL_PROJECT_ID != ''
        run: npx vercel@latest deploy dist --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Deploy production (main)
        if: github.event_name == 'push' && env.VERCEL_PROJECT_ID != ''
        run: npx vercel@latest deploy dist --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
