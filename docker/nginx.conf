server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Service worker must never be cached, so updates reach users.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }
  location = /manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # nginx's mime.types has no ttf/otf; serve fonts with the right type.
  location ~* \.ttf$ { default_type font/ttf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* \.otf$ { default_type font/otf; try_files $uri =404; }

  # Hashed bundles are immutable.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # SPA: unknown paths serve index.html (Expo Router handles the route).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
